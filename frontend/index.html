<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria - Gerenciamento de Livros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 Livraria - Gerenciamento de Livros</h1>
  </header>

  <main>
    <section class="form-section">
      <h2 id="form-titulo">Cadastrar Livro</h2>
      <form id="form-livro">
        <input type="hidden" id="livro-id">

        <label for="titulo">Título*</label>
        <input type="text" id="titulo" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor">

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria">

        <label for="preco">Preço (R$)*</label>
        <input type="number" id="preco" step="0.01" required>

        <label for="quantidade">Quantidade em estoque</label>
        <input type="number" id="quantidade" value="0">

        <div class="botoes">
          <button type="submit" id="btn-salvar">Salvar</button>
          <button type="button" id="btn-cancelar" style="display:none;">Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="lista-section">
      <h2>Livros cadastrados</h2>
      <table id="tabela-livros">
        <thead>
          <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- Preenchido via JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
